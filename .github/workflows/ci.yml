name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - 'engine/**'
              - 'apps/cli/**'
              - 'tests/**'
              - 'data/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - '.github/workflows/ci.yml'
            node:
              - 'packages/**'
              - 'apps/server/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  cpp-build-and-test:
    name: C++ Build & Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Setup Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup MSVC Developer Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Test CLI Bot Execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/apps/cli/pokemon_cli.exe --mode bot --seed 42
          else
            ./build/apps/cli/pokemon_cli --mode bot --seed 42
          fi

  node-build-and-test:
    name: Node Server & Protocol (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Setup Build Tools (Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Dependencies
        run: npm ci

      - name: Build C++ Native Addon
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target pokemon_engine_binding

      - name: Build Workspaces
        run: npm run build

      - name: Run All JS/TS Tests
        run: npm test
