name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - 'engine/**'
              - 'apps/cli/**'
              - 'tests/**'
              - 'data/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - '.github/workflows/ci.yml'
            node:
              - 'packages/**'
              - 'apps/server/**'
              - 'apps/client/**'
              - 'engine/**'
              - 'data/**'
              - 'CMakeLists.txt'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  repo-guard:
    name: Repo Compliance & Asset Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assert No Committed Pokémon Sprites
        run: |
          TRACKED_IMAGES=$(git ls-files | grep -E '\.(png|gif|webp|jpg|jpeg)$' || true)
          ALLOWLIST="apps/client/public/favicon.ico"
          for img in $TRACKED_IMAGES; do
            if [ "$img" != "$ALLOWLIST" ]; then
              echo "ERROR: Forbidden image file committed to repository: $img"
              echo "Per licensing policy, Pokémon sprites must NEVER be committed to Git."
              echo "Self-host using tools/download-sprites.mjs into git-ignored public/sprites/ instead."
              exit 1
            fi
          done
          echo "Repository asset guard passed: 0 forbidden image binaries tracked in Git."

  cpp-build-and-test:
    name: C++ Build & Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Setup Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup MSVC Developer Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Test CLI Bot Execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/apps/cli/pokemon_cli.exe --mode bot --seed 42
          else
            ./build/apps/cli/pokemon_cli --mode bot --seed 42
          fi

  node-build-and-test:
    name: Node Server & Protocol (${{ matrix.os }})
    needs: [changes, repo-guard]
    if: ${{ needs.changes.outputs.node == 'true' || github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Setup Build Tools (Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Dependencies
        run: npm ci

      - name: Build C++ Native Addon
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target pokemon_engine_binding

      - name: Build Workspaces
        run: npm run build

      - name: Run All JS/TS Tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/client

      - name: Run Playwright E2E Tests
        run: npm run test:e2e --workspace=@pokemon/client

  verify-sprites-upstream:
    name: Weekly Upstream PokeAPI Sprite Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify Upstream PokeAPI Sprite Coverage (1-151)
        run: node tools/verify-sprites.mjs

  build-and-push:
    name: Build & Push Production Images (GHCR)
    needs: [repo-guard, cpp-build-and-test, node-build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # 1. Build and Smoke-Test Server Container
      - name: Build Server Image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          load: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Smoke-Test Built Server Container
        run: |
          docker run -d --name smoke-server -p 3000:3000 \
            -e NODE_ENV=production \
            -e GIT_SHA=${{ github.sha }} \
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-server:${{ github.sha }}

          # Wait for container healthz to report commit SHA
          timeout 30s bash -c 'until curl -sf http://127.0.0.1:3000/healthz | grep -q "${{ github.sha }}"; do sleep 1; done'

          # Run automated multi-client battle smoke test
          SERVER_URL=http://127.0.0.1:3000 EXPECTED_SHA=${{ github.sha }} node tools/smoke-test.mjs

          # Teardown smoke test container
          docker stop smoke-server && docker rm smoke-server

      - name: Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-server:latest
          cache-from: type=gha,scope=server

      # 2. Build and Push Web (Caddy + SPA) Container
      - name: Build and Push Web Image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          build-args: |
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || '' }}
            VITE_ANIMATED_SPRITE_URL_TEMPLATE=${{ vars.VITE_ANIMATED_SPRITE_URL_TEMPLATE || '' }}
            VITE_STATIC_SPRITE_URL_TEMPLATE=${{ vars.VITE_STATIC_SPRITE_URL_TEMPLATE || '' }}
            VITE_PARTY_ICON_URL_TEMPLATE=${{ vars.VITE_PARTY_ICON_URL_TEMPLATE || '' }}
            VITE_LOCAL_SPRITES_ENABLED=${{ vars.VITE_LOCAL_SPRITES_ENABLED || 'false' }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-web:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/pokemon-battle-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
